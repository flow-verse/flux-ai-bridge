# SPDX-License-Identifier: GPL-3.0-or-later
# STARTING VALUES FOR OWNER CURATION. These numbers are common-practice guesses
# written for the long-form orchestrator, NOT sourced facts. Edit freely; the
# planner, generator and renderer read everything from this file.
#
# Grid strings are one bar of 16 sixteenth notes.
#   drums:  x = hit, X = accent, o = ghost, . = rest
#   bass:   R root, 3 third, 5 fifth, 7 seventh, 8 octave, b step below root,
#           - = hold previous note, . = rest
#   chords: x = chord on, - = hold, . = rest
name: deep house
aliases: [deep-house, deephouse, house]
tuning: 12tet
bpm: {min: 118, max: 125}
bpm_step_max: 2.0          # largest tempo change between consecutive segments
swing: 0.53                # 0.5 = straight sixteenths
key_system: camelot
keys:
  start: ["A minor", "F minor", "D minor", "G minor", "C minor", "E minor"]
  moves: {"same": 2, "+1": 3, "-1": 3, "relative": 1, "+2 energy boost": 1}
  minor_mode: minor
  major_mode: major
segment:
  target_minutes: 5.5
  forms:
    classic: [[intro, 16], [groove, 32], [build, 16], [peak, 32], [breakdown, 16], [peak, 32], [outro, 16]]
    long_groove: [[intro, 16], [groove, 32], [groove, 16], [build, 8], [peak, 32], [breakdown, 16], [build, 8], [peak, 24], [outro, 16]]
    short: [[intro, 16], [groove, 24], [breakdown, 8], [peak, 32], [outro, 16]]
  transition: {type: blend, bars: 16, eq: true, bass_swap: true}
section_types:
  intro:     {energy: -0.20, mute: [lead, clap, perc]}
  groove:    {energy: -0.05, mute: [lead]}
  build:     {energy: 0.05, mute: [], riser: true}
  peak:      {energy: 0.15, mute: []}
  breakdown: {energy: -0.30, mute: [kick, bass, hat_closed, clap], add: [pad, lead]}
  outro:     {energy: -0.20, mute: [lead, chords]}
energy_curves:
  warmup_two_peaks: [[0.0, 0.30], [0.25, 0.65], [0.40, 0.85], [0.55, 0.60], [0.80, 0.95], [1.0, 0.40]]
  slow_climb:       [[0.0, 0.30], [0.70, 0.90], [0.85, 0.95], [1.0, 0.45]]
  plateau:          [[0.0, 0.35], [0.15, 0.70], [0.85, 0.75], [1.0, 0.40]]
layers:   # minimum energy at which each layer plays (0 = always)
  kick: 0.0
  clap: 0.35
  hat_closed: 0.2
  hat_open: 0.5
  perc: 0.6
  ride: 0.8
  bass: 0.15
  chords: 0.0
  pad: 0.75
  lead: 0.55
drums:
  patterns:
    fourfloor_a: {kick: "x...x...x...x...", clap: "....x.......x...", hat_closed: "..x...x...x...x.", hat_open: "......o.......o.", perc: "...o......o..o..", ride: "x.o.x.o.x.o.x.o."}
    fourfloor_b: {kick: "x...x...x...x...", clap: "....x.......x...", hat_closed: "o.x.o.x.o.x.o.x.", hat_open: "..x...x...x...x.", perc: ".o....o..o....o.", ride: "x...x...x...x..."}
    shuffle_c:   {kick: "x...x...x...x..o", clap: "....x.......x...", hat_closed: "..xo..x...xo..x.", hat_open: "..............x.", perc: "......o.....o...", ride: "x.o.x.o.x.o.x.o."}
    rolling_d:   {kick: "x...x...x...x...", clap: "....x..o....x...", hat_closed: "xoxoxoxoxoxoxoxo", hat_open: "..x...x...x...x.", perc: "...x.....x...x..", ride: "x...x...x...x..."}
    sparse_e:    {kick: "x...x...x...x...", clap: "....x.......x...", hat_closed: "..x...x...x...x.", hat_open: "", perc: "o.......o.......", ride: ""}
  fill: {clap: "....x...x.x.xxxx", hat_closed: "x.x.x.x.xxxxxxxx"}
bass:
  octave: 1
  patterns:
    offbeat:   "..R...R...R...R."
    rolling:   "R.R.8.R..R.R5.R."
    syncop:    "R..R..R.5..R..8."
    walking:   "R-.5..8.R-.3..5."
    sustained: "R-------.R--5---"
chords:
  octave: 4
  tones: [0, 2, 4, 6]          # scale steps above the chord root (seventh chords)
  extension: 8                 # optional ninth added at higher energy
  progressions:
    min_a: [0, 5, 2, 6]        # i  VI  III VII
    min_b: [0, 3, 5, 4]        # i  iv  VI  v
    min_c: [0, 6, 5, 6]        # i  VII VI  VII
    min_d: [0, 0, 3, 3]        # i  i   iv  iv
    min_e: [0, 2, 3, 4]        # i  III iv  v
    min_f: [5, 6, 0, 0]        # VI VII i   i
  rhythms:
    stab_a: "x..x..x...x..x.."
    stab_b: "..x...x...x..x.."
    held:   "x-------x-------"
    pulse:  "x.x.x.x.x.x.x.x."
lead:
  octave: 5
  motif_bars: [1, 2]
  notes_per_bar: [3, 6]
  range_degrees: [-2, 9]
motif_pool: 10
transforms: [identity, up2, down3, invert, retrograde, shift]
no_repeat: {form: 1, drums: 2, bass: 2, progression: 4, chord_rhythm: 1, motif: 5}
timbre:
  kick:       {freq: 50, pitch_amount: 3.0, pitch_decay: 0.04, decay: 0.38, click: 0.3, level_db: -4}
  clap:       {decay: 0.18, tone: 1500, level_db: -14}
  hat_closed: {decay: 0.045, tone: 8000, level_db: -20}
  hat_open:   {decay: 0.22, tone: 7500, level_db: -22}
  perc:       {kind: rim, freq: 900, decay: 0.05, level_db: -20}
  ride:       {decay: 0.6, tone: 6000, level_db: -27}
  bass:  {wave: saw, sub: 0.7, cutoff: 260, env_amount: 2.5, env_decay: 0.12, attack: 0.004, decay: 0.2, sustain: 0.7, release: 0.04, level_db: -11}
  chords: {wave: saw, voices: 2, detune_cents: 9, cutoff: 1300, env_amount: 1.8, env_decay: 0.18, attack: 0.004, decay: 0.25, sustain: 0.35, release: 0.18, level_db: -21, reverb: 0.35, delay: 0.18}
  pad:   {wave: saw, voices: 3, detune_cents: 12, cutoff: 900, env_amount: 0.3, env_decay: 1.0, attack: 0.8, decay: 1.0, sustain: 0.8, release: 1.2, level_db: -25, reverb: 0.5}
  lead:  {wave: square, voices: 1, cutoff: 2200, env_amount: 2.0, env_decay: 0.15, attack: 0.005, decay: 0.15, sustain: 0.4, release: 0.12, level_db: -22, reverb: 0.3, delay: 0.3, vibrato_cents: 0}
  sidechain: {depth: 0.45, release: 0.16}
  reverb: {seconds: 1.8}
  texture: none
neural:
  prompt: "deep house instrumental, warm analog pads, {bpm} BPM, {key}"

# Instruments for --renderer flux-host: factory presets per plugin and layer
# (load_preset names; starting choices for owner curation, chosen by name and a
# level check, not by listening).
flux_host:
  presets:
    "Surge XT": {bass: "Surge XT Factory Presets/Deep end", chords: "Surge XT Factory Presets/House Organ", pad: "Surge XT Factory Presets/Winter warmer", lead: "Surge XT Factory Presets/Nice pluck 1"}
  # Semitones added to each layer's notes so the patch sounds at the written pitch (measured: several
  # factory basses and organs play one or two octaves below the note).
  transpose:
    "Surge XT": {bass: 24, chords: 24, pad: 0, lead: 0}
  # Measured patch levels (flux-engine, test phrase per layer, after transpose) offset so the mix keeps
  # the timbre table's balance relative to the bass.
  gain_db:
    "Surge XT": {bass: 0.0, chords: -6.1, pad: -8.5, lead: -3.8}
