[project]
name = "flux-ai"
version = "0.0.1"
description = "Flux AI workers: stem separation, audio-to-MIDI, beat tracking"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["demucs", "numpy"]
[project.optional-dependencies]
# basic-pitch is installed separately with --no-deps (its resampy<0.4.3 pin does not build on Python 3.12+); see README
transcribe = ["resampy>=0.4.3", "librosa", "mir_eval", "pretty_midi", "scipy", "onnxruntime", "typing_extensions", "setuptools"]
beats = ["madmom"]
dev = ["pytest"]
[project.scripts]
flux-ai = "flux_ai.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
