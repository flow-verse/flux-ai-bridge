[project]
name = "flux-ai"
version = "0.1.0"
description = "Flux AI workers: stem separation, audio-to-MIDI, beat tracking, music generation backends"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["demucs", "numpy"]
[project.optional-dependencies]
# basic-pitch is installed separately with --no-deps (its resampy<0.4.3 pin does not build on Python 3.12+); see README
transcribe = ["resampy>=0.4.3", "librosa", "mir_eval", "pretty_midi", "scipy", "onnxruntime", "typing_extensions", "setuptools"]
beats = ["madmom"]
# Generation backends. Weights are downloaded on demand after licence acceptance; none are bundled.
# ACE-Step 1.5 is not on PyPI and needs Python 3.11 or 3.12; pinned to the commit benchmarked in docs/benchmarks/.
ace-step = ["ace-step @ git+https://github.com/ace-step/ACE-Step-1.5@ca1e85fe9430179831e6bc6be790c332190a3866", "soundfile"]
# MLX is pinned: MLX 0.32 cannot import the .mlxfn files published for magenta-rt 2.0.3.
magenta-rt = ["magenta-rt[mlx]==2.0.3; sys_platform == 'darwin'", "mlx==0.31.2; sys_platform == 'darwin'", "magenta-rt[jax]==2.0.3; sys_platform != 'darwin'", "soundfile", "huggingface_hub"]
# Stable Audio 3 on Apple Silicon: Stability's MLX runtime (fetched at a pinned commit on first use) needs only these;
# mlx stays at magenta-rt's pin when both are installed.
stable-audio-3-mlx = ["mlx>=0.30; sys_platform == 'darwin'", "sentencepiece", "huggingface_hub", "soundfile", "numpy", "scipy"]
# stable-audio-3 (PyTorch, other platforms) pins torch==2.7.1 and transformers>=5.8, which conflict with ace-step: install it in its own venv.
stable-audio-3 = ["stable-audio-3 @ git+https://github.com/Stability-AI/stable-audio-3", "soundfile"]
amt = ["anticipation @ git+https://github.com/jthickstun/anticipation@af37397922665a0fb8d474d7988b0f3755a38d45", "torch", "transformers", "mido"]
bench = ["librosa", "soundfile", "psutil"]
# long-form orchestrator (flux-ai longform); pure numpy/scipy synth, no DAW needed
longform = ["numpy", "scipy", "soundfile", "pyloudnorm", "mido", "jsonschema", "pyyaml", "mutagen"]
# MCP server (flux-mcp). Pinned: the 2.x SDK API (MCPServer) is what flux_mcp is written against.
mcp = ["mcp==2.3.0"]
# Optional LLM eval runner for flux-mcp (python -m flux_mcp.evals --llm); needs ANTHROPIC_API_KEY.
mcp-evals = ["mcp==2.3.0", "anthropic>=2.1,<3"]
dev = ["pytest"]
[project.scripts]
flux-ai = "flux_ai.cli:main"
flux-mcp = "flux_mcp.__main__:main"
[tool.setuptools.package-data]
"flux_ai.longform" = ["schema/*.json", "genres/*.yaml"]
[tool.setuptools.packages.find]
include = ["flux_ai*", "flux_mcp*"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
