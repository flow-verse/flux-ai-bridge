[project]
name = "flux-ai"
version = "0.0.1"
description = "Flux AI workers: stem separation, audio-to-MIDI, beat tracking"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = ["demucs", "basic-pitch", "numpy"]
[project.optional-dependencies]
beats = ["madmom"]
dev = ["pytest"]
[project.scripts]
flux-ai = "flux_ai.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
